<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcOfLife AI</title>

  <meta name="description" content="ArcOfLife AI – Automation, Trading Systems & Telegram Bots. No hype. Only real automation." />

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #0b1c2d, #05070c);
      color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }
    .logo img {
      width: 34px;
      height: 34px;
    }
    .lang-toggle button {
      background: none;
      border: none;
      color: #aaa;
      margin-left: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-toggle .active {
      color: #4fc3ff;
    }
    .hero {
      text-align: center;
      padding: 90px 16px 70px;
    }
    .hero h1 {
      font-size: 40px;
      margin-bottom: 14px;
    }
    .subtitle {
      color: #b0c7dd;
      font-size: 18px;
    }
    .buttons {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 26px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn.primary {
      background: #4fc3ff;
      color: #000;
    }
    .btn.secondary {
      border: 1px solid #4fc3ff;
      color: #4fc3ff;
    }
    section {
      padding: 70px 16px;
      max-width: 1100px;
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 36px;
    }
    .contact form {
      max-width: 420px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .contact input,
    .contact textarea {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #0f1f33;
      color: #fff;
    }
    footer {
      text-align: center;
      padding: 36px 16px;
      color: #8aa4c0;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="ArcOfLife AI Logo">
    <span>ArcOfLife AI</span>
  </div>
</header>

<main>

<section class="hero">
  <h1>Automation. Trading Systems. Smart Infrastructure.</h1>
  <p class="subtitle">No hype. Only real automation.</p>
</section>

<section class="contact" id="contact">
  <h2>Contact</h2>

  <form id="contactForm">
    <input type="text" id="name" placeholder="Your name" required>
    <input type="email" id="email" placeholder="Your email" required>
    <textarea id="message" rows="4" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

</main>

<footer>
  © 2025 ArcOfLife AI<br>
  info@arcoflifeai.com
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;

  const text =
`📩 New message from ArcOfLifeAI.com

👤 Name: ${name}
📧 Email: ${email}

📝 Message:
${message}`;

  fetch("https://api.telegram.org/bot8145919840:AAFH07gd_DpIixmKWuhdi_CDziaJJKFmlBQ/sendMessage", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: "7437099025",
      text: text
    })
  })
  .then(r => {
    if (r.ok) {
      alert("Message sent.");
      document.getElementById("contactForm").reset();
    } else {
      alert("Telegram error.");
    }
  })
  .catch(() => alert("Network error."));
});
</script>

</body>
</html>
