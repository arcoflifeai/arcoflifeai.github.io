<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ArcOfLife AI — Automation & Smart Contracts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root{--bg:#0b0f14;--card:#111826;--txt:#e7eef8;--muted:#a9b6c7;--line:rgba(255,255,255,.08);--accent:#4aa3ff;--radius:16px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;-webkit-text-size-adjust:100%;}
    .wrap{max-width:1100px;margin:auto;padding:20px;width:100%;overflow-x:hidden;}
    header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line);}
    section{margin-top:40px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
    .btn{display:inline-flex;align-items:center;padding:12px 20px;border-radius:14px;font-weight:800;background:var(--accent);color:#fff;text-decoration:none;margin-top:10px;gap:8px;}
    .pay-row{display:flex;align-items:center;gap:12px;margin-bottom:15px;padding:12px;background:rgba(255,255,255,0.03);border-radius:12px;flex-wrap:wrap;}
    #eth{font-size:0.85rem;color:var(--accent);word-break:break-all;overflow-wrap:anywhere;}
    @media(max-width:600px){.btn{width:100%;justify-content:center;}header{justify-content:center;}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <strong>ArcOfLife AI</strong>
      <nav style="display:flex;gap:15px;"><a href="#services" style="color:inherit;text-decoration:none;">Services</a><a href="#payments" style="color:inherit;text-decoration:none;">Payments</a></nav>
    </header>
    <section class="card">
      <h1>Automation that ships.</h1>
      <p>MT4 tools, Telegram automation and Smart Contract development.</p>
      <a class="btn" href="https://t.me/+2FVym2a8Zpg5YTY0" target="_blank"><i class="fab fa-telegram"></i> Join Telegram</a>
    </section>
    <section id="payments">
      <h2>Payment Methods</h2>
      <div class="card">
        <div class="pay-row"><i class="fab fa-paypal"></i> <strong>PayPal:</strong> billing@arcoflifeai.com</div>
        <div class="pay-row">
          <i class="fab fa-ethereum"></i> <strong>ETH (MetaMask):</strong>
          <span id="eth">0xf1FB10aeb4CbdFCe983E4EfFa5d1CD8F16AF1D9E</span>
          <button style="padding:5px 10px;font-size:10px;cursor:pointer;background:var(--accent);color:#000;border:none;border-radius:6px;font-weight:bold;" onclick="navigator.clipboard.writeText('0xf1FB10aeb4CbdFCe983E4EfFa5d1CD8F16AF1D9E')">COPY</button>
        </div>
      </div>
    </section>
    <footer style="text-align:center;margin-top:40px;color:var(--muted);font-size:12px;">© 2025 ArcOfLife AI. All rights reserved.</footer>
  </div>
</body>
</html>
